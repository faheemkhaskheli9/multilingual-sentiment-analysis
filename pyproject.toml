[project]
name = "multilingual-sentiment-analysis"
version = "0.1.0"
description = "Multilingual Sentiment Analysis"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Phase 1 classical baseline (issue #2).
baseline = ["scikit-learn>=1.3", "pandas>=2.0"]
# Optional statistical language detector.
langdetect = ["langdetect>=1.0.9"]
# Phase 2 multilingual transformer.
transformer = ["transformers>=4.38", "torch>=2.1", "datasets>=2.16"]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["src"]
